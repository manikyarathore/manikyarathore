name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-summary-cards.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
          THEME: tokyonight
          AUTO_PUSH: false

      - name: Commit cards as Manikya
        run: |
          git reset --soft origin/main
          git config user.name "Manikya Rathore"
          git config user.email "manikyarathore79@gmail.com"
          git add profile-summary-card-output
          git commit -m "Update profile stats $(TZ=Asia/Kolkata date +%F)" || echo "No change"
          git push origin HEAD:main
